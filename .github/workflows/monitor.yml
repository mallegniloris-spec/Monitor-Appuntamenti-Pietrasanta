name: Monitor appuntamenti Pietrasanta - API
on:
  schedule:
    # Monitor automatico ogni 15 minuti.
    - cron: '3,18,33,48 * * * *'
    # Lettura comandi Telegram nei minuti intermedi, per polling ogni 5 minuti.
    - cron: '8,13,23,28,38,43,53,58 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo verifica API, senza notifiche e senza alterare lo storico'
        required: false
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: appointments-monitor
  cancel-in-progress: false
jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test logica offline
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '3,18,33,48 * * * *'
        run: python monitor.py --test
      - name: Controllo automatico API
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '3,18,33,48 * * * *'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi
      - name: Leggi comandi Telegram
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python telegram_commands.py
      - name: Salva storico e ultimo comando letto
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json telegram_offset.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna storico e comandi Telegram'
            git push
          fi
