name: Monitor appuntamenti Pietrasanta - API
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo verifica API, senza notifiche'
        required: false
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: appointments-monitor
  cancel-in-progress: false
jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test logica offline
        run: python monitor.py --test
      - name: Controllo API
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi
      - name: Salva stato sulla branch main
        if: success() && (github.event_name == 'schedule' || inputs.dry_run == false)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna stato disponibilita'
            git push
          fi
