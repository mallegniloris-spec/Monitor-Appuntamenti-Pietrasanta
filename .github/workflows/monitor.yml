name: Controllo appuntamenti Pietrasanta
'on':
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Diagnostica senza notifiche (true / false)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pietrasanta-monitor
  cancel-in-progress: false
jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Ripristina rilevazioni precedenti
        uses: actions/cache/restore@v4
        with:
          path: stato.json
          key: pietrasanta-stato-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pietrasanta-stato-
      - name: Esegui controllo o diagnostica
        shell: bash
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic }}
        run: |
          if [ "$DIAGNOSTIC" = "true" ]; then
            python monitor.py --diagnostic
          else
            python monitor.py --once
          fi
      - name: Conserva stato
        if: success() && inputs.diagnostic != true
        uses: actions/cache/save@v4
        with:
          path: stato.json
          key: pietrasanta-stato-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Scarica diagnostica
        if: always() && inputs.diagnostic == true
        uses: actions/upload-artifact@v4
        with:
          name: schermate-calendari
          path: diagnostica/
          retention-days: 3
