name: Diagnostica Benedetta Matteini
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leggi fasce Benedetta (sola lettura)
        run: python diagnostica_benedetta.py
